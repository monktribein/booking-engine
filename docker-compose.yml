# Stack: web + API + worker + Redis (+ an optional local PostgreSQL).
#   cp backend/.env.example backend/.env   (fill in secrets and DATABASE_URL)
#   docker compose up --build
#
# Database: PostgreSQL is hosted (Supabase). Put its connection string in backend/.env as DATABASE_URL. The one-shot
# `migrate` service applies the SQL migrations before the API and worker start.
#
# Fully local, no Supabase: in backend/.env set DATABASE_SSL=disable and DATABASE_URL to the "postgres" service below
# (user tirvona, database tirvona, host postgres, port 5432; the password is POSTGRES_PASSWORD), then run
#   docker compose --profile local-db up --build
x-app: &app
  build: ./backend
  env_file: ./backend/.env
  environment:
    REDIS_URL: redis://redis:6379
    QUEUE_DRIVER: bullmq
  depends_on:
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
  restart: unless-stopped

services:
  # Next.js web app. Build args are PUBLIC (compiled into the browser bundle). No secrets are passed to this service.
  #   PUBLIC_API_URL  = the API address the BROWSER uses (e.g. https://api.example.com; http://localhost:3000 for a local run)
  #   PUBLIC_APP_URL  = this site's public URL; it must also be listed in the API's CORS_ORIGINS (.env)
  # Server-side rendering reaches the API on the private network through API_INTERNAL_URL.
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3001}
    environment:
      API_INTERNAL_URL: http://api:3000
      ALLOW_INSECURE_API_URL: ${ALLOW_INSECURE_API_URL:-false}   # true ONLY for a local run over plain http
    ports: ["3001:3000"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  api:
    <<: *app
    ports: ["3000:3000"]
    environment:
      REDIS_URL: redis://redis:6379
      QUEUE_DRIVER: bullmq
      WORKERS_ENABLED: "false"      # API instances only produce jobs
      SCHEDULER_ENABLED: "false"

  worker:
    <<: *app
    command: ["node", "dist/src/worker.js"]   # consumes all BullMQ queues + runs the scheduler

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]  # BullMQ requires noeviction
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  # One-shot: applies backend/src/database/migrations to DATABASE_URL (idempotent, serialised by an advisory lock).
  # On Supabase point DATABASE_URL at the direct or session-pooler connection, not the transaction pooler (port 6543).
  migrate:
    build: ./backend
    env_file: ./backend/.env
    command: ["node", "dist/scripts/db-migrate.js"]
    depends_on:
      postgres: { condition: service_healthy, required: false }
    restart: "no"

  # Optional local database (profile "local-db"). Use Supabase in any shared or production environment.
  postgres:
    image: postgres:17-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: tirvona
      POSTGRES_PASSWORD: tirvona-local   # secret-scan:allow (local-only container)
      POSTGRES_DB: tirvona
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tirvona -d tirvona"]
      interval: 5s
      retries: 20

volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      retries: 30

volumes:
  pg-data:
  redis-data:
